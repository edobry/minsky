# Per-PR cockpit preview deploy (mt#2096).
#
# Deploys the cockpit server to Railway when a PR touches cockpit source
# files. Verifies the deploy actually works (health + data endpoints),
# then posts the preview URL as a PR comment. Redeploys production on
# PR close/merge to restore main-branch state.
#
# Architecture: single Railway environment (production) — each PR push
# overwrites the prior deploy. Sufficient for a single-operator workflow
# where parallel cockpit previews are not needed. If parallel previews
# become necessary, upgrade to per-PR Railway environments with a
# workspace-level API token.
#
# Prerequisites (one-time manual setup):
#   1. Railway project + service created for cockpit-preview
#   2. RAILWAY_COCKPIT_TOKEN secret set on this repo (project token scoped to production env)
#   3. Real resource IDs in services/cockpit/railway.config.ts
#   4. Read-only Supabase DB role created (see scripts/supabase-preview-role.sql)

name: Cockpit Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "src/cockpit/**"
      - "services/cockpit/**"

concurrency:
  group: cockpit-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_URL: https://cockpit-preview-production.up.railway.app

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy cockpit preview
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_COCKPIT_TOKEN }}
        run: |
          # See the restore job's matching step for why this timestamp exists.
          echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          railway up \
            --service cockpit-preview \
            --detach

      # mt#4272 — the same check the restore job gained, for the same reason,
      # and it belongs BEFORE the health assertions below rather than beside
      # them. Those assertions are good at what they test (the passkey gate is
      # mounted, the domain layer booted) and blind to whether THIS deploy is
      # the one answering: a failed build leaves the previous one running, and
      # it returns the same 200, the same 401, and the same gated:true. So the
      # existing step would pass on a failed deploy — and would spend five
      # minutes polling a URL that was already healthy before concluding so.
      #
      # Ordering it first also makes the failure legible: "the deploy failed"
      # rather than "the gate assertions passed, somehow."
      - name: Verify the deploy actually landed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_COCKPIT_TOKEN }}
        run: |
          # Foreground probe first — see the restore job's matching step for why
          # a broken probe is invisible once it is inside a wait loop.
          if ! PROBE=$(railway deployment list --json --limit 1 --service cockpit-preview 2>&1); then
            echo "FAIL: cannot list deployments — the verify probe is broken, not the deploy."
            echo "$PROBE"
            exit 1
          fi
          if ! printf '%s' "$PROBE" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "FAIL: 'railway deployment list --json' did not return an array — the probe is broken."
            echo "$PROBE"
            exit 1
          fi

          echo "Waiting for the deployment created after $DEPLOY_STARTED_AT to reach a terminal status..."
          for i in $(seq 1 60); do
            STATUS=$(railway deployment list --json --limit 5 --service cockpit-preview \
              | jq -r --arg since "$DEPLOY_STARTED_AT" \
                  '[.[] | select(.createdAt >= $since)] | first | .status // empty')

            case "$STATUS" in
              SUCCESS)
                echo "Deploy reached SUCCESS."
                LANDED=1
                break
                ;;
              FAILED|CRASHED|REMOVED)
                echo "FAIL: the preview deploy ended in $STATUS."
                echo "Build logs:"
                railway logs --json --lines 100 || true
                exit 1
                ;;
              "")
                echo "  [$i/60] no deployment registered yet"
                ;;
              *)
                echo "  [$i/60] $STATUS"
                ;;
            esac
            sleep 10
          done

          if [ "${LANDED:-0}" != "1" ]; then
            echo "FAIL: no terminal status within 10 minutes (last seen: ${STATUS:-none})."
            exit 1
          fi

          # Freshness — see the restore job's matching block for the full
          # reasoning. In short: SUCCESS means built and promoted, not up and
          # answering, and the step below can only tell "something healthy is
          # serving" from "THIS build is serving" by the process start time.
          # The identity half is covered here by the next step's cockpit-specific
          # route assertions; the restore job, which has no such step, checks the
          # health body's service field itself.
          echo "Confirming the deployed build is the one serving..."
          STARTED_EPOCH_MS=$(date -u -d "$DEPLOY_STARTED_AT" +%s000 2>/dev/null \
            || date -u -jf '%Y-%m-%dT%H:%M:%SZ' "$DEPLOY_STARTED_AT" +%s000)

          for i in $(seq 1 30); do
            STARTED=$(curl -s --max-time 15 "$PREVIEW_URL/api/health" \
              | jq -r '.processStartedAtMs // empty' 2>/dev/null || echo '')
            if [ -n "$STARTED" ] && [ "$STARTED" -ge "$STARTED_EPOCH_MS" ]; then
              echo "Serving a process started $STARTED (>= upload $STARTED_EPOCH_MS)."
              exit 0
            fi
            echo "  [$i/30] started=${STARTED:-unreachable} (want >= $STARTED_EPOCH_MS)"
            sleep 10
          done

          echo "FAIL: deploy reached SUCCESS but the live service never reported a process started at or after this run's upload."
          echo "The previous build is most likely still serving."
          exit 1

      - name: Verify preview is live
        run: |
          echo "Waiting for preview to come up..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/api/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health endpoint: 200 OK"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "FAIL: health endpoint did not return 200 after 5 minutes (last: $HTTP_CODE)"
              exit 1
            fi
            sleep 5
          done

          # mt#4023: the preview is passkey-gated, so CI (which holds no
          # credential) can no longer read a data endpoint. The previous check
          # fetched /api/widgets and treated an empty result as "domain layer
          # failed to initialize" — against a gated deployment that check
          # reports a boot failure whenever the gate is working, which is the
          # opposite of the truth. It is replaced below.

          # The gate is mounted and Express is routing: a data route must refuse
          # an anonymous caller. A 200 here would mean the gate is NOT applied —
          # exactly the exposure mt#4023 closed — so this assertion is now the
          # security check as well as the liveness check.
          TASKS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/api/tasks")
          if [ "$TASKS_CODE" != "401" ]; then
            echo "FAIL: GET /api/tasks returned $TASKS_CODE (expected 401 — the passkey gate should deny anonymous reads)"
            exit 1
          fi
          echo "Passkey gate: anonymous data read refused (401)"

          # The domain layer initialized: /api/auth/status is public AND queries
          # the database (it counts enrolled passkeys), so it is a stronger boot
          # probe than the old widget-registry read, which touched no storage.
          #
          # 503 is ACCEPTED and means "auth tables not present yet" — expected on
          # the PR that introduces migration 0094, since the preview points at
          # the production database and that migration applies after merge. The
          # gate fails closed in that state (the 401 above still holds), so 503
          # is an availability signal, never an exposure.
          STATUS_BODY=$(curl -s -o /tmp/auth-status.json -w "%{http_code}" "$PREVIEW_URL/api/auth/status")
          if [ "$STATUS_BODY" = "200" ]; then
            if ! grep -q '"gated":true' /tmp/auth-status.json; then
              echo "FAIL: /api/auth/status returned 200 but did not report gated:true"
              cat /tmp/auth-status.json
              exit 1
            fi
            echo "Auth status: gated:true, database reachable"
          elif [ "$STATUS_BODY" = "503" ]; then
            echo "Auth status: 503 — auth tables not yet migrated (expected before 0094 applies); gate still denying"
          else
            echo "FAIL: /api/auth/status returned $STATUS_BODY (expected 200 or 503)"
            cat /tmp/auth-status.json || true
            exit 1
          fi

          # Mutations: the passkey gate now answers BEFORE the preview-mode
          # mutation guard, so an anonymous POST is 401 rather than the 403 this
          # step used to assert. The 403 path still exists for an authenticated
          # caller and is covered by src/cockpit/server-security.test.ts.
          MUTATION_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PREVIEW_URL/api/asks/smoke-test/resolve" \
            -H "Content-Type: application/json" -d '{"responder":"operator","payload":{}}')
          if [ "$MUTATION_CODE" != "401" ]; then
            echo "FAIL: POST to mutation endpoint returned $MUTATION_CODE (expected 401 from the passkey gate)"
            exit 1
          fi
          echo "Passkey gate: anonymous mutation refused (401)"
          echo "All verification checks passed."

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Cockpit Preview',
              '',
              `**Preview URL:** ${process.env.PREVIEW_URL}`,
              '',
              `Deployed from commit \`${context.payload.pull_request.head.sha.slice(0, 9)}\`.`,
              'Preview runs in **read-only mode** — mutations are disabled.',
              '',
              `_Updated by [Cockpit Preview](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.includes('### Cockpit Preview') &&
              c.user?.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  restore:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Restore main-branch deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_COCKPIT_TOKEN }}
        run: |
          # Record the wall clock BEFORE the upload so the verify step below can
          # tell the deployment this run created from any that preceded it.
          echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          railway up \
            --service cockpit-preview \
            --detach

      # mt#4272. `railway up --detach` returns as soon as the upload completes;
      # Railway's own CLI help says so outright — "starts an upload and
      # deployment, but it does not wait for the deployment to become healthy.
      # Poll with `railway deployment list --json`" — and gives the flag the
      # alias --no-wait. So without this step the job succeeds whatever Railway
      # then does with the upload.
      #
      # That is not hypothetical: on 2026-08-18 this service took SIX
      # consecutive FAILED deploys over ~50 minutes (21:14Z through 22:04Z),
      # every one of them reported green by its workflow run, while the preview
      # URL kept serving the 21:08Z build. Nothing surfaced it.
      #
      # Why this polls Railway rather than reusing the deploy job's health
      # check: a failed deploy leaves the PREVIOUS build running, and that build
      # answers /api/health with 200 exactly like a fresh one. A URL probe
      # therefore passes in precisely the case this step exists to catch — it
      # verifies "something healthy is serving", never "the deploy I just made
      # is serving" (mem#704: a probe that returns the same result when the
      # system is broken is not verification). Only the deployment's own
      # terminal status distinguishes them.
      - name: Verify the restore deploy actually landed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_COCKPIT_TOKEN }}
        run: |
          # Run the probe ONCE in the foreground before wrapping it in a loop.
          # If `deployment list` fails — a token that does not scope this
          # project, a CLI flag that changed — its output is empty, jq yields
          # empty, and the loop below reads that as "not registered yet": sixty
          # iterations emitting exactly what a pending deploy emits, then a
          # timeout that blames Railway. There is no moment at which that looks
          # wrong, which is why the check goes here and not in the loop.
          if ! PROBE=$(railway deployment list --json --limit 1 --service cockpit-preview 2>&1); then
            echo "FAIL: cannot list deployments — the verify probe is broken, not the deploy."
            echo "$PROBE"
            exit 1
          fi
          if ! printf '%s' "$PROBE" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "FAIL: 'railway deployment list --json' did not return an array — the probe is broken."
            echo "$PROBE"
            exit 1
          fi

          echo "Waiting for the deployment created after $DEPLOY_STARTED_AT to reach a terminal status..."
          for i in $(seq 1 60); do
            # Newest-first; take the newest deployment created at or after the
            # upload. An empty result means Railway has not registered it yet.
            STATUS=$(railway deployment list --json --limit 5 --service cockpit-preview \
              | jq -r --arg since "$DEPLOY_STARTED_AT" \
                  '[.[] | select(.createdAt >= $since)] | first | .status // empty')

            case "$STATUS" in
              SUCCESS)
                echo "Deploy reached SUCCESS."
                LANDED=1
                break
                ;;
              FAILED|CRASHED|REMOVED)
                echo "FAIL: the restore deploy ended in $STATUS."
                echo "Build logs:"
                railway logs --json --lines 100 || true
                exit 1
                ;;
              "")
                echo "  [$i/60] no deployment registered yet"
                ;;
              *)
                echo "  [$i/60] $STATUS"
                ;;
            esac
            sleep 10
          done

          if [ "${LANDED:-0}" != "1" ]; then
            echo "FAIL: no terminal status within 10 minutes (last seen: ${STATUS:-none})."
            exit 1
          fi

          # SUCCESS means the deployment BUILT and was promoted. It does not mean
          # the process is up and answering — a container can reach SUCCESS and
          # then crash on boot. And "the URL answers" is not enough either: the
          # PREVIOUS build answers identically, which is the blind spot that let
          # six failed deploys read as green.
          #
          # So assert two things about the live service, not one:
          #   - identity: the health BODY says minsky-cockpit. Every service here
          #     is built from the same monorepo, so a misconfigured build can put
          #     a DIFFERENT app on this host and it answers 200 exactly like the
          #     right one (mt#3148 / mt#3142).
          #   - freshness: processStartedAtMs is at or after this run's upload, so
          #     the process answering is the one this run deployed rather than a
          #     survivor of a failed replacement.
          echo "Confirming the restored build is the one serving..."
          STARTED_EPOCH_MS=$(date -u -d "$DEPLOY_STARTED_AT" +%s000 2>/dev/null \
            || date -u -jf '%Y-%m-%dT%H:%M:%SZ' "$DEPLOY_STARTED_AT" +%s000)

          for i in $(seq 1 30); do
            BODY=$(curl -s --max-time 15 "$PREVIEW_URL/api/health" || echo '')
            SERVICE=$(printf '%s' "$BODY" | jq -r '.service // empty' 2>/dev/null || echo '')
            STARTED=$(printf '%s' "$BODY" | jq -r '.processStartedAtMs // empty' 2>/dev/null || echo '')

            if [ "$SERVICE" = "minsky-cockpit" ] && [ -n "$STARTED" ] && [ "$STARTED" -ge "$STARTED_EPOCH_MS" ]; then
              echo "Serving minsky-cockpit, started $STARTED (>= upload $STARTED_EPOCH_MS)."
              exit 0
            fi
            if [ -n "$SERVICE" ] && [ "$SERVICE" != "minsky-cockpit" ]; then
              echo "FAIL: the host is serving '$SERVICE', not minsky-cockpit — wrong artifact deployed."
              exit 1
            fi
            echo "  [$i/30] service=${SERVICE:-unreachable} started=${STARTED:-?} (want >= $STARTED_EPOCH_MS)"
            sleep 10
          done

          echo "FAIL: deploy reached SUCCESS but the live service never reported a process started at or after this run's upload."
          echo "The previous build is most likely still serving."
          exit 1
