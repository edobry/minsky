# Per-PR cockpit preview deploy (mt#2096).
#
# Deploys the cockpit server to Railway when a PR touches cockpit source
# files. Verifies the deploy actually works (health + data endpoints),
# then posts the preview URL as a PR comment. Redeploys production on
# PR close/merge to restore main-branch state.
#
# Architecture: single Railway environment (production) — each PR push
# overwrites the prior deploy. Sufficient for a single-operator workflow
# where parallel cockpit previews are not needed. If parallel previews
# become necessary, upgrade to per-PR Railway environments with a
# workspace-level API token.
#
# Prerequisites (one-time manual setup):
#   1. Railway project + service created for cockpit-preview
#   2. RAILWAY_COCKPIT_TOKEN secret set on this repo (project token scoped to production env)
#   3. Real resource IDs in services/cockpit/railway.config.ts
#   4. Read-only Supabase DB role created (see scripts/supabase-preview-role.sql)

name: Cockpit Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "src/cockpit/**"
      - "services/cockpit/**"

concurrency:
  group: cockpit-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_URL: https://cockpit-preview-production.up.railway.app

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy cockpit preview
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_COCKPIT_TOKEN }}
        run: |
          railway up \
            --service cockpit-preview \
            --detach

      - name: Verify preview is live
        run: |
          echo "Waiting for preview to come up..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/api/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health endpoint: 200 OK"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "FAIL: health endpoint did not return 200 after 5 minutes (last: $HTTP_CODE)"
              exit 1
            fi
            sleep 5
          done

          # mt#4023: the preview is passkey-gated, so CI (which holds no
          # credential) can no longer read a data endpoint. The previous check
          # fetched /api/widgets and treated an empty result as "domain layer
          # failed to initialize" — against a gated deployment that check
          # reports a boot failure whenever the gate is working, which is the
          # opposite of the truth. It is replaced below.

          # The gate is mounted and Express is routing: a data route must refuse
          # an anonymous caller. A 200 here would mean the gate is NOT applied —
          # exactly the exposure mt#4023 closed — so this assertion is now the
          # security check as well as the liveness check.
          TASKS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/api/tasks")
          if [ "$TASKS_CODE" != "401" ]; then
            echo "FAIL: GET /api/tasks returned $TASKS_CODE (expected 401 — the passkey gate should deny anonymous reads)"
            exit 1
          fi
          echo "Passkey gate: anonymous data read refused (401)"

          # The domain layer initialized: /api/auth/status is public AND queries
          # the database (it counts enrolled passkeys), so it is a stronger boot
          # probe than the old widget-registry read, which touched no storage.
          #
          # 503 is ACCEPTED and means "auth tables not present yet" — expected on
          # the PR that introduces migration 0094, since the preview points at
          # the production database and that migration applies after merge. The
          # gate fails closed in that state (the 401 above still holds), so 503
          # is an availability signal, never an exposure.
          STATUS_BODY=$(curl -s -o /tmp/auth-status.json -w "%{http_code}" "$PREVIEW_URL/api/auth/status")
          if [ "$STATUS_BODY" = "200" ]; then
            if ! grep -q '"gated":true' /tmp/auth-status.json; then
              echo "FAIL: /api/auth/status returned 200 but did not report gated:true"
              cat /tmp/auth-status.json
              exit 1
            fi
            echo "Auth status: gated:true, database reachable"
          elif [ "$STATUS_BODY" = "503" ]; then
            echo "Auth status: 503 — auth tables not yet migrated (expected before 0094 applies); gate still denying"
          else
            echo "FAIL: /api/auth/status returned $STATUS_BODY (expected 200 or 503)"
            cat /tmp/auth-status.json || true
            exit 1
          fi

          # Mutations: the passkey gate now answers BEFORE the preview-mode
          # mutation guard, so an anonymous POST is 401 rather than the 403 this
          # step used to assert. The 403 path still exists for an authenticated
          # caller and is covered by src/cockpit/server-security.test.ts.
          MUTATION_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PREVIEW_URL/api/asks/smoke-test/resolve" \
            -H "Content-Type: application/json" -d '{"responder":"operator","payload":{}}')
          if [ "$MUTATION_CODE" != "401" ]; then
            echo "FAIL: POST to mutation endpoint returned $MUTATION_CODE (expected 401 from the passkey gate)"
            exit 1
          fi
          echo "Passkey gate: anonymous mutation refused (401)"
          echo "All verification checks passed."

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Cockpit Preview',
              '',
              `**Preview URL:** ${process.env.PREVIEW_URL}`,
              '',
              `Deployed from commit \`${context.payload.pull_request.head.sha.slice(0, 9)}\`.`,
              'Preview runs in **read-only mode** — mutations are disabled.',
              '',
              `_Updated by [Cockpit Preview](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.includes('### Cockpit Preview') &&
              c.user?.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  restore:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Restore main-branch deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_COCKPIT_TOKEN }}
        run: |
          railway up \
            --service cockpit-preview \
            --detach