name: Test Quality Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Secondary hedge for the mt#3623 install flake: disables the streaming
  # tarball path implicated upstream (oven-sh/bun#34821; fix PR #34827 is still
  # unmerged, so no release carries a fix). Measured at 0 failures in 10
  # cold-cache installs with the flag set, against a 3-in-10 unmitigated
  # baseline -- mt#3623 records both runs and the method. The per-step retry
  # loops remain the load-bearing mitigation.
  # Remove both when a bun release carries the upstream fix.
  BUN_FEATURE_FLAG_DISABLE_STREAMING_INSTALL: "1"

jobs:
  test-quality:
    name: Prevent Placeholder Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: for i in 1 2 3; do if bun install; then break; fi; if [ "$i" = 3 ]; then exit 1; fi; echo "bun install failed (mt#3623 tarball flake) - retry $i"; sleep 5; done

      - name: Detect placeholder tests
        run: |
          # Check for bare expect(true).toBe(true) placeholder assertions
          if grep -r --exclude-dir=node_modules "expect(true)\.toBe(true)" --include="*.test.ts" --include="*.test.js" .; then
            echo "::error::Placeholder assertions detected (expect(true).toBe(true)). Please replace with real assertions."
            exit 1
          fi

          # Check for tests explicitly marked as placeholders via comments
          if grep -r --exclude-dir=node_modules "// [Pp]laceholder\|// TODO.*test\|// FIXME.*test" --include="*.test.ts" --include="*.test.js" .; then
            echo "::error::Placeholder test comments detected. Please implement proper tests."
            exit 1
          fi

          echo "No placeholder tests detected."