name: Site Build Smoke

# mt#5061 — pre-merge build check for the minsky-site marketing service.
#
# WHY THIS EXISTS. Site was the only deployed service with NO pre-merge build
# verification. `docker-build-smoke.yml` covers the three Dockerfile-built
# services; site builds via nixpacks on Railway, so nothing built it before
# merge. The consequence was measured rather than hypothetical: every site
# deploy failed from 2026-09-09 18:45Z across at least three main commits,
# while every check on those very commits stayed green. The failure was only
# noticed because `post-deploy-health-monitor` had been red for 22 consecutive
# runs and someone finally read one.
#
# WHAT IT VERIFIES, and why it mirrors the deploy rather than approximating it.
# `services/site/nixpacks.toml` pins bun by installing `bun-v1.3.14` to
# `/usr/local/bin/bun` and invoking every phase through that absolute path.
# This job installs the SAME pinned version the same way, then runs the same
# `bun install` + `bun run build`. That matters: the outage was caused by the
# BUN VERSION (1.1.43 could not parse react-dom's bun server bundle), so a
# check that let the runner's default bun float would be blind to exactly the
# defect it exists to catch — the substrate direction of
# `/implement-task` §7 item 8.
#
# The pin is read from nixpacks.toml rather than duplicated, so the two cannot
# drift apart silently. A drift would otherwise reproduce this whole incident
# one layer up: a check that passes on a bun the deploy does not use.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  site-build-smoke:
    name: site-build-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the bun version pinned by nixpacks.toml
        id: pin
        run: |
          set -euo pipefail
          version="$(grep -oE 'bun-v[0-9]+\.[0-9]+\.[0-9]+' services/site/nixpacks.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error::No pinned 'bun-vX.Y.Z' found in services/site/nixpacks.toml." \
                 "The pin is the thing this job exists to exercise — refusing to fall back" \
                 "to the runner's default bun, which would make this check unable to fail."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned bun: $version"

      # Installs under $HOME, NOT /usr/local (PR #3703 R1, blocking). The
      # nixpacks build runs as root, so it can write /usr/local; a GitHub-hosted
      # runner's `runner` user cannot, and the installer would fail with
      # Permission denied. The PATH differs between the two by necessity; the
      # VERSION is the thing that has to match, and it is read from
      # nixpacks.toml above rather than restated here.
      #
      # curl and unzip (the installer needs both) are preinstalled on
      # ubuntu-latest, so no apt-get step — but `set -euo pipefail` plus the
      # explicit `--version` below means their absence would fail this step
      # loudly rather than silently falling through to a different bun.
      - name: Install the pinned bun
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install \
            | BUN_INSTALL="$HOME/.bun" bash -s -- "${{ steps.pin.outputs.version }}"
          "$HOME/.bun/bin/bun" --version

      - name: Verify the installed bun matches the pin
        run: |
          set -euo pipefail
          expected="${{ steps.pin.outputs.version }}"
          expected="${expected#bun-v}"
          actual="$("$HOME/.bun/bin/bun" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Installed bun $actual does not match the pin $expected from" \
                 "services/site/nixpacks.toml. This check would be exercising a different" \
                 "toolchain than the deploy, which is the defect it exists to catch."
            exit 1
          fi
          echo "bun $actual matches the pin"

      - name: Build the site
        working-directory: services/site
        run: |
          set -euo pipefail
          "$HOME/.bun/bin/bun" install
          "$HOME/.bun/bin/bun" run build
