name: Deploy MCP

# mt#2104 — CI-built Docker image → GHCR → Railway deploy pipeline.
#
# Builds the Docker image, smoke-tests it (boot + /health probe), and on
# push to main pushes to GHCR and triggers a Railway redeploy. On PRs the
# Docker build + smoke runs without pushing or deploying — this closes the
# mt#2103 coverage gap where the bundle-boot-smoke tested the local build
# but not the Docker build, missing a Bun-version-specific bundler
# regression that only surfaced in the Docker/Railway environment.
#
# mt#2461 — paths filter scopes the trigger to minsky-mcp's actual build
# closure (the root Dockerfile's COPY set + Dockerfile itself). Commits
# that only touch services/cockpit/web/**, docs/**, or other unrelated
# paths no longer trigger a Docker build or Railway redeploy, eliminating
# the ~10-20 unnecessary redeploys/day that were rotating Railway logs and
# dropping in-flight requests. This `paths:` filter is the SINGLE SOURCE of
# minsky-mcp's build closure: minsky-mcp is a GHCR image-based (sourceImage)
# Railway service, which cannot use Railway config-as-code (config_path), so
# there is no railway.json for it (mt#2472 removed the one mt#2461 added —
# Railway rejects config_path on a source_image service). Keep this list in
# sync with the root Dockerfile's COPY set.
#
# Prerequisites (one-time setup):
# 1. RAILWAY_TOKEN secret in GitHub Actions (Railway dashboard > Account >
#    Tokens > create; add as repo secret).
# 2. Railway minsky-mcp service configured to use image source
#    ghcr.io/edobry/minsky:latest (Railway dashboard > service > Settings >
#    Source > Docker Image).
# 3. GHCR package visibility set to match repo visibility (ghcr.io Settings
#    > Manage access > set visibility).

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "packages/shared/package.json"
      - "packages/shared/tsconfig.json"
      - "packages/shared/src/**"
      - "packages/domain/package.json"
      - "packages/domain/tsconfig.json"
      - "packages/domain/src/**"
      - "services/reviewer/package.json"
      - "services/site/package.json"
      - "services/cockpit/package.json"
      - ".minsky/config.yaml"
      - "src/**"
      - ".github/workflows/deploy-minsky-mcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "packages/shared/package.json"
      - "packages/shared/tsconfig.json"
      - "packages/shared/src/**"
      - "packages/domain/package.json"
      - "packages/domain/tsconfig.json"
      - "packages/domain/src/**"
      - "services/reviewer/package.json"
      - "services/site/package.json"
      - "services/cockpit/package.json"
      - ".minsky/config.yaml"
      - "src/**"
      - ".github/workflows/deploy-minsky-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only one deploy at a time. cancel-in-progress is FALSE (mt#2505): the job now
# runs a prod migration step, and cancelling mid-migration could leave held
# locks or a partially-applied migration set. Serialize instead — a new push
# queues behind the in-flight deploy rather than cancelling it. (Cost: redundant
# builds are no longer auto-cancelled; acceptable for prod-migration safety.)
concurrency:
  group: deploy-minsky-mcp-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/edobry/minsky

jobs:
  docker-build-smoke:
    name: docker-build-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE:ci .

      - name: Boot container and probe /health
        run: |
          set -euo pipefail

          PORT=$(( 30000 + RANDOM % 20000 ))
          echo "Boot port: $PORT"

          docker run --rm -d --name minsky-smoke \
            -e PORT=$PORT \
            -e MINSKY_MCP_AUTH_TOKEN=smoke-test \
            -p $PORT:$PORT \
            $IMAGE:ci

          cleanup() {
            docker stop minsky-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          DEADLINE=$(( $(date +%s) + 30 ))
          while [ "$(date +%s)" -lt $DEADLINE ]; do
            if curl -fsS "http://127.0.0.1:$PORT/health" > /tmp/health.json 2>/dev/null; then
              echo "/health responded within deadline:"
              cat /tmp/health.json
              echo
              exit 0
            fi
            sleep 0.5
          done

          echo "/health did not respond 200 within 30s"
          docker logs minsky-smoke 2>&1 | tail -50 || true
          exit 1

      # mt#2505 — deploy-keyed, single-runner PROD migration. Runs INSIDE the
      # freshly-built image (the exact artifact about to deploy), BEFORE the
      # :latest push that triggers the Railway deploy. Migrate therefore GATES
      # the deploy: a failure here aborts the job, the image is never pushed, and
      # Railway keeps the prior version running against the unchanged schema
      # (Heroku-release-phase semantics). Idempotent (drizzle high-water-mark =
      # no-op when nothing is pending); the workflow `concurrency` group keeps it
      # single-runner. This is the controlled prod-touch that replaces
      # auto-migrate-on-boot (the default flip ships separately, AFTER this is
      # live + verified — the mt#2505 sequencing constraint).
      #
      # SECURITY: this step (like every secret-using step) is gated to
      # push/workflow_dispatch on main; the workflow triggers on `pull_request`
      # (NOT pull_request_target) and GitHub does not pass secrets to fork PRs,
      # so the mt#1477 pwn-request class does not apply. NEVER convert this
      # workflow to pull_request_target.
      - name: Apply migrations to production
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          # mt#2542 least-privilege split: this repo secret holds the DDL-capable
          # `postgres` migration credential — the ONLY CI-stored DDL credential.
          # Deliberately DIFFERENT from the runtime services' sealed var (same
          # env-var NAME, but the services connect as the DML-only `minsky_app`
          # role — infra/index.ts: sealed 'minsky-app-postgres-url';
          # scripts/supabase-app-role.sql).
          # mt#2439: the bundle reads MINSKY_PERSISTENCE_POSTGRES_URL — NOT
          # MINSKY_POSTGRES_URL/DATABASE_URL — or it silently targets the wrong DB.
          #
          # Secret handling (PR #1737 R2 non-blocking): GitHub auto-masks
          # `secrets.*` in all step logs, and the value is forwarded into the
          # container BY NAME (`-e MINSKY_PERSISTENCE_POSTGRES_URL` below, no
          # value on the command line) and never echoed — so it cannot reach the
          # logs even with ACTIONS_STEP_DEBUG enabled. No `::add-mask::` needed.
          MINSKY_PERSISTENCE_POSTGRES_URL: ${{ secrets.MINSKY_PERSISTENCE_POSTGRES_URL }}
        run: |
          set -euo pipefail

          if [ -z "${MINSKY_PERSISTENCE_POSTGRES_URL:-}" ]; then
            echo "::error::MINSKY_PERSISTENCE_POSTGRES_URL secret not set — refusing to deploy."
            echo "Add the prod Postgres connection as a repo secret to enable the deploy-keyed"
            echo "migration (mt#2505). Failing the job avoids shipping new code against an"
            echo "unmigrated schema (the out-of-band-coordination hazard)."
            exit 1
          fi

          # Forward the secret by NAME (no value on the command line / in logs).
          # MINSKY_PERSISTENCE_BACKEND mirrors the service env (infra/index.ts:69).
          # Wrapped in `timeout` (mt#2505 R1): a hung DB connection / lock must
          # fail the deploy fast, not sit until the GH Actions job cap (~6h). The
          # migrator is idempotent (drizzle HWM), so a retried run resumes safely.
          #
          # No `--preload reflect-metadata` (mt#3773): the bundle installs the
          # polyfill itself since mt#3680, so the flag is redundant here. It is
          # removed rather than left in place because a preloaded invocation boots
          # whether or not the bundle is self-sufficient — keeping it on the
          # migration step would mean the one command that touches the production
          # schema is also the one that never exercises the real boot path.
          set +e
          timeout 600 docker run --rm \
            -e MINSKY_PERSISTENCE_BACKEND=postgres \
            -e MINSKY_PERSISTENCE_POSTGRES_URL \
            "$IMAGE:ci" \
            bun run dist/minsky.js persistence migrate --execute
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ]; then
              echo "::error::prod migration timed out after 600s — failing the deploy (no image pushed)."
            else
              echo "::error::prod migration failed (exit $rc) — failing the deploy (no image pushed)."
            fi
            exit "$rc"
          fi
          echo "Prod migration step completed (exit 0)."

      - name: Login to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker tag $IMAGE:ci $IMAGE:latest
          docker tag $IMAGE:ci $IMAGE:sha-${SHORT_SHA}
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}
          echo "Pushed: $IMAGE:latest, $IMAGE:sha-${SHORT_SHA}"

      - name: Trigger Railway redeploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          # Preferred (mt#3907): a Railway token scoped to the minsky-mcp
          # project. Provisioned 2026-08-10 after mt#3890 found the generic
          # secret was never authorized for this service.
          RAILWAY_MCP_TOKEN: ${{ secrets.RAILWAY_MCP_TOKEN }}
          # Fallback: the shared secret. Scoped to a DIFFERENT project and
          # known not to work here — kept only so a missing preferred secret
          # degrades to a diagnosable failure rather than an empty-token one.
          # It must NOT be re-scoped: cockpit-preview.yml and
          # post-deploy-health-monitor.yml depend on its current scope.
          RAILWAY_TOKEN_FALLBACK: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          # mt#3907 — this step was a raw GraphQL curl sending
          # `Authorization: Bearer`, guarded by warn-not-fail branches whose
          # stated justification was that "Railway auto-deploys the pushed
          # ghcr.io/edobry/minsky:latest image independently (mt#2342)".
          #
          # BOTH halves of that were false, and together they hid a 4.5-day
          # production outage (mt#3890):
          #
          #   1. Railway does NOT auto-deploy this image. Between 2026-08-05
          #      and 2026-08-10 every "Deploy MCP" run went green while
          #      Railway recorded ZERO new deployments — verified by querying
          #      the deployments connection three ways (service-scoped,
          #      depth 10, environment-scoped). The service served a 4.5-day-
          #      old image the entire time.
          #   2. The Bearer header cannot work with a project-scoped token at
          #      all: Railway's API requires `Project-Access-Token` for those.
          #      So the credential the operator was asked to mint could not
          #      have fixed the curl even once provisioned.
          #
          # The fix is the shape deploy-reviewer.yml already uses (mt#3180,
          # which fixed this identical failure for the reviewer on 2026-07-25
          # and explicitly named THIS workflow as still relying on the false
          # auto-deploy claim — nothing carried it across). The CLI accepts
          # account, workspace, AND project tokens, so it is token-type
          # agnostic and the header problem disappears.
          #
          # This step is now FATAL. A redeploy that does not happen must red
          # the build: a silent deploy failure is strictly worse than a loud
          # one, and "silent" is exactly what cost 4.5 days here.

          if [ -n "${RAILWAY_MCP_TOKEN:-}" ]; then
            echo "Using RAILWAY_MCP_TOKEN (minsky-mcp-scoped, mt#3907)."
            RAILWAY_TOKEN="${RAILWAY_MCP_TOKEN}"
          else
            echo "::warning::RAILWAY_MCP_TOKEN is not set — falling back to the generic RAILWAY_TOKEN, which is NOT scoped to minsky-mcp and is expected to fail (mt#3890)."
            RAILWAY_TOKEN="${RAILWAY_TOKEN_FALLBACK:-}"
          fi
          export RAILWAY_TOKEN

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Neither RAILWAY_MCP_TOKEN nor RAILWAY_TOKEN is set — minsky-mcp redeploy cannot be triggered."
            exit 1
          fi

          npm install -g @railway/cli

          # Railway identifier from services/minsky-mcp/deploy.config.ts, kept
          # inline to match the convention in this file and deploy-reviewer.yml.
          # No `railway link` is needed: a project-scoped RAILWAY_TOKEN carries
          # its own project+environment context (mt#3251).
          SERVICE_ID="a7c5195f-55de-472a-87e4-34e921a15171"

          # Diagnostic only (non-fatal): prints the authenticated identity,
          # never the token, so a scope problem is self-diagnosing instead of
          # another round of guessing. Email masked — this repo's CI logs are
          # public.
          echo "Railway auth identity:"
          railway whoami 2>&1 | sed -E 's/([A-Za-z0-9._%+-]+)@/***@/g' \
            || echo "note: railway whoami did not report an authenticated identity (non-fatal diagnostic) — see the token-scope notes above if the redeploy below also fails."

          # `--from-source` is REQUIRED, not decorative: minsky-mcp is an
          # image-source service, and without this flag `redeploy` re-deploys
          # the EXISTING deployment (the same stale image) instead of pulling
          # the `:latest` tag this job just pushed. Per `railway redeploy
          # --help`: "Pull and deploy the latest commit or image from the
          # configured source, instead of redeploying the existing deployment."
          if railway redeploy --from-source --service "${SERVICE_ID}" -y; then
            echo "Railway redeploy triggered successfully via the CLI."
          else
            rc=$?
            echo "::error::railway redeploy failed (exit ${rc}). See the 'whoami' output above to distinguish a token-scope problem from a genuine redeploy failure."
            exit "$rc"
          fi
