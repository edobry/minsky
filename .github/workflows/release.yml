name: Release

on:
  push:
    tags:
      - "v*"

env:
  # Secondary hedge for the mt#3623 install flake: disables the streaming
  # tarball path implicated upstream (oven-sh/bun#34821; fix PR #34827 is still
  # unmerged, so no release carries a fix). Effectiveness is UNVERIFIED -- the
  # failure needs a flaky network and would not reproduce locally, so it could
  # not be measured. The per-step retry loops are the load-bearing mitigation.
  # Remove both when a bun release carries the upstream fix.
  BUN_FEATURE_FLAG_DISABLE_STREAMING_INSTALL: "1"

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux
            output: minsky-linux-x64
          - target: linux-arm64
            output: minsky-linux-arm64
          - target: macos
            output: minsky-macos-x64
          - target: macos-arm64
            output: minsky-macos-arm64
          - target: windows
            output: minsky-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: for i in 1 2 3; do if bun install; then break; fi; if [ "$i" = 3 ]; then exit 1; fi; echo "bun install failed (mt#3623 tarball flake) - retry $i"; sleep 5; done

      # `bun test` below runs the FULL suite, which includes the
      # session.grep_search tests that spawn `rg` (mt#3163). ubuntu-latest does
      # not ship ripgrep, so without this the release build would fail on them.
      # Every matrix entry runs on ubuntu-latest (targets are cross-compiled), so
      # apt-get is correct for all of them.
      - name: Install ripgrep (required by session.grep_search)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run tests
        run: bun test

      - name: Build binary
        run: just build-${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            minsky-linux-x64/minsky-linux-x64
            minsky-linux-arm64/minsky-linux-arm64
            minsky-macos-x64/minsky-macos-x64
            minsky-macos-arm64/minsky-macos-arm64
            minsky-windows-x64.exe/minsky-windows-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
