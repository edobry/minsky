name: Publish to npm

# mt#3616 — ADR-033 execution: publish the `@edobry/minsky` package on every `v*` tag.
#
# Auth is npm TRUSTED PUBLISHING (OIDC), per docs.npmjs.com/trusted-publishers:
# no NPM_TOKEN secret exists or is needed — GitHub mints a short-lived,
# workflow-specific OIDC credential and npm accepts it because this repo +
# workflow filename are registered as the package's trusted publisher.
# Provenance attestations are generated automatically on this path.
#
# EXTERNAL PRECONDITION (one-time, operator) — SATISFIED 2026-08-10 (mt#3874):
# `@edobry/minsky` → Settings → Trusted Publisher lists GitHub repo
# `edobry/minsky` with workflow filename `publish-npm.yml`. The evidence is
# 0.1.1: this workflow published it and it carries a provenance attestation,
# which npm generates on the OIDC path only — and no NPM_TOKEN secret exists to
# have taken any other path. If the registration is ever removed, this workflow
# FAILS at the publish step with an auth error; that means "precondition gone",
# not a code defect.
#
# The package was NOT created by mt#3616 — that task shipped this workflow and
# closed without publishing anything. `@edobry/minsky@0.1.0` was published
# manually on 2026-08-10 under mt#3874. The unscoped name `minsky` is
# unavailable: npm rejects it at PUT as too similar to `minify` (mt#3915), so
# `registry.npmjs.org/minsky` returning 404 is the expected steady state, not a
# signal that the name is claimable.
#
# Version source: package.json's `version` field. mt#233 owns automating the
# bump + tag; this workflow only reacts to the tag.
#
# Runner floor for trusted publishing: npm CLI >= 11.5.1 (Node 24 ships it).
# setup-node's registry-url step is what makes `npm publish` target the
# public registry with the OIDC exchange.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish-npm:
    name: publish-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      # `npm publish` runs `prepublishOnly` (bun run build) itself, but building
      # explicitly first keeps the failure surface separated: a build break fails
      # here with build logs, not inside npm's pack step.
      - name: Build production bundle
        run: bun run build

      - name: Verify bundle + assets present
        run: |
          test -f dist/minsky.js || { echo "::error::dist/minsky.js missing"; exit 1; }
          test -d dist/hooks || { echo "::error::dist/hooks missing"; exit 1; }
          test -d dist/storage/migrations/pg || { echo "::error::dist/storage/migrations/pg missing"; exit 1; }

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Guard against tag/manifest drift (PR #2593 R1): publishing vX.Y.Z must
      # publish exactly package.json's X.Y.Z — a mismatch means the bump and
      # the tag came apart (mt#233 owns keeping them together).
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "$TAG_VERSION" = "$PKG_VERSION" ] \
            || { echo "::error::tag $TAG_VERSION != package.json $PKG_VERSION"; exit 1; }

      - name: Publish
        run: npm publish
